<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#663399" />
    <meta name="color-scheme" content="light only" />
    <meta
      name="keywords"
      content="吳振榮, Zhenrong Wu, 前端工程師, 網頁開發, 遊戲開發, React, 作品集, 程式設計, 台灣, 自由接案, 軟體設計師"
    />

    <meta name="robots" content="index, follow" />

    <!-- 全站共用的社群分享 meta；頁面層級的 title / description / url 由 src/components/Seo.jsx 提供 -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ZHENRONG WU" />
    <meta property="og:locale" content="zh_TW" />
    <meta property="og:image" content="https://zhenrongwu.github.io/og-image.jpg" />
    <meta property="og:image:alt" content="吳振榮個人照" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://zhenrongwu.github.io/og-image.jpg" />
    <!-- 首屏個人照：Vite 建置時會把 href 改寫成帶 hash 的實際路徑 -->
    <link rel="preload" as="image" href="/src/assets/images/avatar.webp" type="image/webp" fetchpriority="high" />

    <!-- Sitemap -->
    <link rel="sitemap" type="application/xml" href="/sitemap.xml" />

    <!-- 預設標題；React 掛載後由各頁 <Seo/> 覆寫 -->
    <title>ZHENRONG WU</title>
  </head>

    <noscript>請啟用 JavaScript 以瀏覽本網站。</noscript>
