name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # sitemap 的 lastmod 取自各頁最後一次 commit 日期，淺層 clone 會讀不到
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci
      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          CF_BEACON_TOKEN: ${{ vars.CF_BEACON_TOKEN }}

      - name: Verify route metadata
        run: |
          grep -q '<link rel="canonical" href="https://zhenrongwu.github.io/"' build/index.html
          grep -q '<link rel="canonical" href="https://zhenrongwu.github.io/about"' build/about.html
          grep -q '<link rel="canonical" href="https://zhenrongwu.github.io/portfolio"' build/portfolio.html
          grep -q '<link rel="canonical" href="https://zhenrongwu.github.io/resume"' build/resume.html
          grep -q 'content="noindex, follow"' build/404.html
          test -s build/sitemap.xml
          test -s build/resume.pdf
          test -s build/projects.json
          test -s build/projects/p1.webp

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: build

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346

  # devherohub.com 的「參與過的專案」在建置時讀 projects.json，部署完通知它重新建置
  rebuild-devherohub:
    name: Rebuild devherohub.com
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Cloudflare deploy hook
        env:
          DEPLOY_HOOK: ${{ secrets.DEVHEROHUB_DEPLOY_HOOK }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "::warning::未設定 DEVHEROHUB_DEPLOY_HOOK，略過"
            exit 0
          fi
          curl -fsS -X POST "$DEPLOY_HOOK" > /dev/null
