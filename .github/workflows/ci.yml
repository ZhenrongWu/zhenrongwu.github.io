name: CI

on:
  pull_request:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # sitemap 的 lastmod 取自各頁最後一次 commit 日期，淺層 clone 會讀不到
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
      - name: Verify route metadata
        run: |
          grep -q '<link rel="canonical" href="https://zhenrongwu.github.io/"' build/index.html
          grep -q '<link rel="canonical" href="https://zhenrongwu.github.io/about"' build/about.html
          grep -q '<link rel="canonical" href="https://zhenrongwu.github.io/portfolio"' build/portfolio.html
          grep -q '<link rel="canonical" href="https://zhenrongwu.github.io/resume"' build/resume.html
          grep -q 'content="noindex, follow"' build/404.html
          test -s build/sitemap.xml
          test -s build/resume.pdf
      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: build
          path: build
          retention-days: 7
